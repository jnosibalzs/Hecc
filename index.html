<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Csak neked Peti!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0a0a0a;
        --paper: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: var(--paper);
        color: var(--ink);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(1.5rem, 4vw, 3rem);
        font-family: "Bebas Neue", Impact, Haettenschweiler, sans-serif;
      }

      main {
        width: min(100%, 36rem);
        text-align: center;
      }

      h1 {
        font-size: clamp(2.75rem, 10vw, 4.75rem);
        font-weight: 400;
        letter-spacing: 0.02em;
        line-height: 0.95;
        margin-bottom: clamp(1.25rem, 3vw, 2rem);
        animation: rise 700ms ease-out both;
      }

      figure {
        margin: 0;
        animation: fade 900ms ease-out 120ms both;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: middle;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.6rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Csak neked Peti!</h1>
      <figure>
        <img
          src="gorilla-upscaled.jpg"
          alt="Gorilla, aki a középső ujját mutatja"
          width="864"
          height="1152"
        />
      </figure>
    </main>
  </body>
</html>
